[project]
name = "mlb-lineups"
version = "0.1.0"
description = "Flask web application for retrieving MLB game lineups, starting pitchers, and umpire information"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.0",
    "pytz>=2024.1",
    "MLB-StatsAPI>=1.7.0",
    "flask>=3.1.0",
    "flask-cors>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.0",
]
prod = [
    "gunicorn>=23.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: marks a test as a unit test",
    "integration: marks a test as an integration test",
]

[tool.uv]
exclude-newer = "3 days"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
